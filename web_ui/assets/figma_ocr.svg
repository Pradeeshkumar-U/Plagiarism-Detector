<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <!-- Primary Indigo Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <!-- Card Glass Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141b2d" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f1524" stop-opacity="0.75" />
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .text-title { font-family: 'Outfit', 'Segoe UI', sans-serif; font-weight: 800; }
    .text-semibold { font-family: 'Outfit', 'Segoe UI', sans-serif; font-weight: 600; }
    .text-regular { font-family: 'Outfit', 'Segoe UI', sans-serif; font-weight: 400; }
    .text-hand { font-family: 'Courier New', Courier, monospace; font-style: italic; }
  </style>

  <!-- CANVAS BACKGROUND -->
  <rect width="1440" height="900" fill="url(#bg-grad)" />

  <!-- SIDEBAR GROUP -->
  <g id="sidebar" filter="url(#shadow)">
    <!-- Sidebar Backplate -->
    <rect width="260" height="900" fill="#0f1422" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    
    <!-- Logo Section -->
    <g id="logo" transform="translate(24, 24)">
      <!-- Logo Box -->
      <rect width="36" height="36" rx="10" fill="url(#accent-grad)" />
      <!-- Logo Icon Symbol -->
      <path d="M18,10 L25,13 L25,20 C25,24.5 21,27.5 18,29 C15,27.5 11,24.5 11,20 L11,13 L18,10 Z" fill="#ffffff" />
      <text x="50" y="25" fill="#ffffff" class="text-title" font-size="20">AuraCheck</text>
      <rect x="164" y="8" width="30" height="18" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="170" y="21" fill="#6b7280" class="text-semibold" font-size="10">v1.2</text>
    </g>

    <!-- Navigation List -->
    <g id="nav-list" transform="translate(16, 100)">
      <!-- Dashboard - Inactive -->
      <g id="nav-dashboard">
        <rect width="228" height="44" rx="8" fill="transparent" />
        <rect x="16" y="14" width="6" height="16" rx="1" fill="#9ca3af" opacity="0.6" />
        <rect x="25" y="14" width="6" height="8" rx="1" fill="#9ca3af" opacity="0.6" />
        <rect x="25" y="24" width="6" height="6" rx="1" fill="#9ca3af" opacity="0.6" />
        <text x="46" y="27" fill="#9ca3af" class="text-semibold" font-size="14">Dashboard</text>
      </g>

      <!-- Run Scan Link -->
      <g id="nav-run-scan" transform="translate(0, 52)">
        <rect width="228" height="44" rx="8" fill="transparent" />
        <path d="M16,14 L28,14 L28,26 L16,26 Z" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linejoin="round" />
        <path d="M22,14 L22,26" fill="none" stroke="#9ca3af" stroke-width="2" />
        <text x="46" y="27" fill="#9ca3af" class="text-semibold" font-size="14">Run Scan</text>
      </g>

      <!-- Compare Documents Link -->
      <g id="nav-compare" transform="translate(0, 104)">
        <rect width="228" height="44" rx="8" fill="transparent" />
        <path d="M16,16 L22,22 L16,28" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M28,16 L22,22 L28,28" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="46" y="27" fill="#9ca3af" class="text-semibold" font-size="14">Compare Documents</text>
      </g>

      <!-- OCR Config Link - Active -->
      <g id="nav-ocr" transform="translate(0, 156)">
        <rect width="228" height="44" rx="8" fill="url(#accent-grad)" />
        <circle cx="18" cy="18" r="3" fill="#ffffff" />
        <circle cx="28" cy="26" r="3" fill="#ffffff" />
        <line x1="14" y1="26" x2="23" y2="26" stroke="#ffffff" stroke-width="2" />
        <line x1="23" y1="18" x2="30" y2="18" stroke="#ffffff" stroke-width="2" />
        <text x="46" y="27" fill="#ffffff" class="text-semibold" font-size="14">OCR Config</text>
      </g>
    </g>

    <!-- User Profile at bottom -->
    <g id="profile" transform="translate(16, 824)">
      <circle cx="24" cy="24" r="20" fill="#4f46e5" />
      <text x="24" y="29" fill="#ffffff" class="text-semibold" font-size="14" text-anchor="middle">AP</text>
      <text x="56" y="20" fill="#ffffff" class="text-semibold" font-size="14">Aakash P.</text>
      <text x="56" y="34" fill="#6b7280" class="text-regular" font-size="11">Academic Admin</text>
    </g>
  </g>

  <!-- MAIN APP PANEL -->
  <g id="main-panel" transform="translate(260, 0)">
    
    <!-- TOP HEADER -->
    <g id="header">
      <rect width="1180" height="70" fill="#080c14" opacity="0.5" />
      <line x1="0" y1="70" x2="1180" y2="70" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      
      <!-- Search Input Mock -->
      <g id="search" transform="translate(32, 17)">
        <rect width="320" height="36" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <path d="M16,18 A4,4 0 1,1 24,18 A4,4 0 1,1 16,18 M22,22 L26,26" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" />
        <text x="42" y="22" fill="#6b7280" class="text-regular" font-size="13">Search submissions, reports, and authors...</text>
      </g>

      <!-- Header actions -->
      <g id="header-actions" transform="translate(860, 16)">
        <rect x="0" y="4" width="120" height="28" rx="14" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.2)" stroke-width="1" />
        <circle cx="16" cy="18" r="4" fill="#10b981" />
        <text x="28" y="22" fill="#10b981" class="text-semibold" font-size="11">System Active</text>

        <g id="btn-scan" transform="translate(140, 0)">
          <rect width="148" height="38" rx="8" fill="url(#accent-grad)" />
          <path d="M16,14 L24,19 L16,24 Z" fill="#ffffff" />
          <text x="36" y="24" fill="#ffffff" class="text-semibold" font-size="13">Start Batch Scan</text>
        </g>
      </g>
    </g>

    <!-- CONTENT PORT -->
    <g id="content" transform="translate(32, 100)">
      
      <!-- Page Title -->
      <text x="0" y="10" fill="#ffffff" class="text-title" font-size="28">OCR Preprocessing Configurator</text>
      <text x="0" y="32" fill="#9ca3af" class="text-regular" font-size="14">Optimize image preprocessing pipelines for scanned PDFs before OCR text extraction.</text>
      
      <!-- GRID ROW -->
      <g id="settings-split" transform="translate(0, 60)">
        
        <!-- Left Side: Controls Card -->
        <g id="controls-card" filter="url(#shadow)">
          <rect width="440" height="600" rx="14" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
          <text x="24" y="35" fill="#ffffff" class="text-semibold" font-size="16">Preprocessing Pipelines</text>
          <text x="24" y="55" fill="#9ca3af" class="text-regular" font-size="12">Adjust settings to handle handwritten or noisy scanned PDFs.</text>

          <!-- Control Group 1: Otsu -->
          <g id="ctrl-otsu" transform="translate(24, 100)">
            <text x="0" y="12" fill="#cbd5e1" class="text-semibold" font-size="13">Otsu Binarization Threshold</text>
            <text x="392" y="12" fill="#6366f1" class="text-title" font-size="13" text-anchor="end">Auto (Otsu)</text>
            <line x1="0" y1="28" x2="392" y2="28" stroke="rgba(255,255,255,0.08)" stroke-width="4" stroke-linecap="round" />
            <line x1="0" y1="28" x2="200" y2="28" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round" />
            <circle cx="200" cy="28" r="8" fill="#ffffff" filter="url(#shadow)" />
            <text x="0" y="48" fill="#6b7280" class="text-regular" font-size="11">Converts grayscale pages into high contrast binary black-and-white.</text>
          </g>

          <!-- Control Group 2: Denoise -->
          <g id="ctrl-denoise" transform="translate(24, 200)">
            <text x="0" y="12" fill="#cbd5e1" class="text-semibold" font-size="13">FastNL Denoising (Strength)</text>
            <text x="392" y="12" fill="#6366f1" class="text-title" font-size="13" text-anchor="end">10</text>
            <line x1="0" y1="28" x2="392" y2="28" stroke="rgba(255,255,255,0.08)" stroke-width="4" stroke-linecap="round" />
            <line x1="0" y1="28" x2="130" y2="28" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round" />
            <circle cx="130" cy="28" r="8" fill="#ffffff" filter="url(#shadow)" />
            <text x="0" y="48" fill="#6b7280" class="text-regular" font-size="11">Filters scan noise, specs, and shadows. Higher is cleaner but less sharp.</text>
          </g>

          <!-- Control Group 3: Upscale -->
          <g id="ctrl-upscale" transform="translate(24, 300)">
            <text x="0" y="12" fill="#cbd5e1" class="text-semibold" font-size="13">Page Upscale Factor</text>
            <text x="392" y="12" fill="#6366f1" class="text-title" font-size="13" text-anchor="end">2x</text>
            <line x1="0" y1="28" x2="392" y2="28" stroke="rgba(255,255,255,0.08)" stroke-width="4" stroke-linecap="round" />
            <line x1="0" y1="28" x2="180" y2="28" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round" />
            <circle cx="180" cy="28" r="8" fill="#ffffff" filter="url(#shadow)" />
            <text x="0" y="48" fill="#6b7280" class="text-regular" font-size="11">Increases image resolution for small fonts before OCR feeding.</text>
          </g>

          <!-- Control Group 4: PSM -->
          <g id="ctrl-psm" transform="translate(24, 400)">
            <text x="0" y="12" fill="#cbd5e1" class="text-semibold" font-size="13">Tesseract OCR Page Segmentation Mode (PSM)</text>
            <rect x="0" y="24" width="392" height="38" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
            <text x="16" y="48" fill="#ffffff" class="text-semibold" font-size="12">3 - Fully automatic page segmentation (Default)</text>
            <path d="M360,40 L366,46 L372,40" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
          </g>

          <!-- Save parameters button -->
          <g id="btn-save" transform="translate(24, 520)">
            <rect width="392" height="46" rx="8" fill="url(#accent-grad)" />
            <text x="196" y="28" fill="#ffffff" class="text-semibold" font-size="14" text-anchor="middle">Save OpenCV Settings</text>
          </g>
        </g>

        <!-- Right Side: Slider preview visualizer -->
        <g id="preview-card" transform="translate(470, 0)" filter="url(#shadow)">
          <rect width="670" height="600" rx="14" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
          <text x="24" y="35" fill="#ffffff" class="text-semibold" font-size="16">Live Preprocessing Preview</text>
          <text x="24" y="55" fill="#9ca3af" class="text-regular" font-size="12">Move the slider to compare raw student scan vs OpenCV preprocessed output.</text>

          <!-- Visual Slider Box -->
          <g id="visual-compare-box" transform="translate(24, 86)">
            <!-- Border mask box -->
            <rect width="622" height="480" rx="8" fill="#121824" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
            
            <!-- BEFORE IMAGE SIDE (drawn as background page) -->
            <g id="page-before" transform="translate(111, 40)">
              <!-- Noisy gray paper -->
              <rect width="400" height="400" rx="4" fill="#e2e8f0" />
              <!-- Shadow smudges -->
              <ellipse cx="100" cy="120" rx="120" ry="90" fill="rgba(139,92,26,0.12)" filter="url(#shadow)" />
              <ellipse cx="280" cy="300" rx="80" ry="80" fill="rgba(139,92,26,0.1)" />
              
              <!-- Paper text -->
              <g transform="translate(24, 30)" fill="#475569" class="text-regular" font-size="11">
                <text x="0" y="20" class="text-semibold" font-size="14" fill="#0f172a">Assignment 1: Algorithms</text>
                <text x="0" y="44" class="text-hand" fill="#2563eb">Name: John Doe</text>
                <text x="0" y="80">We implement quicksort using a pivot-based divide and</text>
                <text x="0" y="100">conquer paradigm. In this experiment, we analyze quicksort's</text>
                <text x="0" y="120">worst case O(n^2) when array is pre-sorted. This code</text>
                <text x="0" y="140">executes in linear time in best-case scenarios with</text>
                <text x="0" y="160">median-of-three pivot selectors.</text>
              </g>
            </g>

            <!-- AFTER IMAGE SIDE (Masked left half) -->
            <!-- We draw the clean white paper and clip it to x-values from 0 to 311 (left 50%) -->
            <clipPath id="split-mask">
              <rect x="0" y="0" width="311" height="480" />
            </clipPath>

            <g id="page-after" clip-path="url(#split-mask)">
              <!-- Dark background of left side -->
              <rect width="622" height="480" fill="#0f172a" />
              
              <g transform="translate(111, 40)">
                <!-- Clean white paper -->
                <rect width="400" height="400" rx="4" fill="#ffffff" />
                
                <!-- Clean text -->
                <g transform="translate(24, 30)" fill="#000000" class="text-regular" font-size="11">
                  <text x="0" y="20" class="text-semibold" font-size="14" fill="#000000">Assignment 1: Algorithms</text>
                  <text x="0" y="44" class="text-semibold" fill="#000000">Name: John Doe</text>
                  <text x="0" y="80" class="text-semibold">We implement quicksort using a pivot-based divide and</text>
                  <text x="0" y="100" class="text-semibold">conquer paradigm. In this experiment, we analyze quicksort's</text>
                  <text x="0" y="120" class="text-semibold">worst case O(n^2) when array is pre-sorted. This code</text>
                  <text x="0" y="140" class="text-semibold">executes in linear time in best-case scenarios with</text>
                  <text x="0" y="160" class="text-semibold">median-of-three pivot selectors.</text>
                </g>
              </g>
            </g>

            <!-- SPLIT SLIDER HANDLE -->
            <g id="slider-handle" transform="translate(311, 0)">
              <line x1="0" y1="0" x2="0" y2="480" stroke="#6366f1" stroke-width="2" />
              <circle cx="0" cy="240" r="18" fill="url(#accent-grad)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />
              <path d="M-6,240 L-2,236 L-2,244 Z M6,240 L2,236 L2,244 Z" fill="#ffffff" />
            </g>

            <!-- BADGES -->
            <rect x="426" y="434" width="180" height="30" rx="15" fill="rgba(30,41,59,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
            <text x="516" y="453" fill="#cbd5e1" class="text-semibold" font-size="10" text-anchor="middle">Raw Scanned PDF Page</text>

            <rect x="16" y="434" width="220" height="30" rx="15" fill="rgba(99,102,241,0.85)" stroke="rgba(99,102,241,0.2)" stroke-width="1" />
            <text x="126" y="453" fill="#ffffff" class="text-semibold" font-size="10" text-anchor="middle">OpenCV Binarized (Tesseract Ready)</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
